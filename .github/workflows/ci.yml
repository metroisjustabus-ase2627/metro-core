# CI: build Metro.sln on pushes to main, develop, feature/** and bugfix/**, on pull requests, and on manual runs.
# Requirements: CON-CI-01 (automatic build from the repository), CON-CI-02.
# Tests, linting, Docker and deployment are added by separate workflows/tasks.

name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: Build (Release)
    # Defaults to GitHub-hosted; set the repository variable CI_RUNNER to use the self-hosted runner.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Metro.sln

      - name: Build
        run: dotnet build Metro.sln --no-restore -c Release
