# Continuous Integration (CI) — Metro Core
# Responsibility (T03): integrate, build, run unit tests with coverage, verify quality & security,
# and produce ONE immutable versioned Docker artifact tagged with the commit SHA (Build Only Once).
# Deployment is intentionally separated into cd-dev.yml (CD to Dev VM) and cd-prod.yml (CDE to Prod VM).
# Requirements: CON-CI-01, CON-CI-02, CON-DEP-01, CON-DEP-05.

name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs only: every push to main must produce its own image (CON-CI-02).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: Build and Unit Tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Metro.sln

      - name: Build (Release)
        run: dotnet build Metro.sln --no-restore -c Release

      - name: Run unit tests with Cobertura coverage
        run: >
          dotnet test Metro.sln --no-build -c Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  quality:
    name: Static Analysis and Security Checks
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Metro.sln

      - name: Verify formatting (.editorconfig)
        run: dotnet format whitespace Metro.sln --no-restore --verify-no-changes --verbosity diagnostic

      - name: Static analysis (.NET analyzers)
        run: >
          dotnet build Metro.sln --no-restore -c Release
          -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest

      - name: Check vulnerable NuGet packages (SCA)
        run: |
          dotnet list Metro.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Vulnerable NuGet packages detected (see log)"
            exit 1
          fi

      - name: Secret scan (Gitleaks OSS — CON-DEP-05)
        run: >
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:latest
          detect --source=/repo --no-banner --redact

  artifact:
    name: Package Immutable Docker Image (GHCR)
    needs: [build, quality]
    # Pushes to main publish the immutable SHA image; PRs validate Dockerfile without pushing.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/metroisjustabus-ase2627/metro-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=metro-core
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push (Build Only Once)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Artifact summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published immutable CI artifact"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
