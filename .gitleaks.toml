title = "MetroIsJustABus — Gitleaks Configuration (CON-DEP-05)"

[extend]
useDefault = true

[allowlist]
description = "Exclude explicit CHANGE_ME placeholders, build outputs, unit-test fixtures, and automated AI transcript blobs"
regexes = [
  '''CHANGE_ME_[A-Za-z0-9_]+''',
]
paths = [
  '''(^|/)\.git/''',
  '''(^|/)\.ai/logs/transcripts/''',
  '''(^|/)tests/''',
  '''(^|/)bin/''',
  '''(^|/)obj/''',
  '''(^|/)TestResults/''',
]
