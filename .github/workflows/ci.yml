# CI: build Metro.sln on pushes to main, develop, feature/** and bugfix/**, on pull requests, and on manual runs.
# Requirements: CON-CI-01 (automatic build from the repository), CON-CI-02.
# After a successful build, the "image" job builds the Docker image and, on pushes to main, pushes it to GHCR
# tagged with the commit SHA (CON-CI-02, CON-DEP-01). The build job also runs the automated tests, and the
# "quality" job runs basic code quality checks (formatting, analyzers, vulnerable packages); the image job
# requires both. Deployment is a separate task.

name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs only: every push to main must produce its own image (CON-CI-02).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: Build (Release)
    # Defaults to GitHub-hosted; set the repository variable CI_RUNNER to use the self-hosted runner.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Metro.sln

      - name: Build
        run: dotnet build Metro.sln --no-restore -c Release

      - name: Test
        run: >
          dotnet test Metro.sln --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  quality:
    name: Code quality
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Metro.sln

      # Formatting / whitespace rules (.editorconfig defaults).
      - name: Verify formatting
        run: dotnet format whitespace Metro.sln --no-restore --verify-no-changes --verbosity diagnostic

      # Built-in .NET analyzers; surface warnings in the log.
      - name: Static analysis (build with analyzers)
        run: >
          dotnet build Metro.sln --no-restore -c Release
          -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest

      - name: Check vulnerable packages
        run: |
          dotnet list Metro.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            # Warn only: transitive findings (e.g. System.Security.Cryptography.Pkcs via MailKit) are tracked, not blocking.
            echo "::warning::Vulnerable NuGet packages found (see log)"
          fi

  image:
    name: Docker image (GHCR)
    needs: [build, quality]
    # Pushes to main publish the image; pull requests only build it to validate the Dockerfile.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/metroisjustabus-ase2627/metro-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Full commit SHA always; "latest" only on the default branch (main).
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=metro-core
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Single-manifest image: the SHA tag resolves directly to the runnable image.
          provenance: false

      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
